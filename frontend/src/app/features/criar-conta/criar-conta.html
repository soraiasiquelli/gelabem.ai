<div class="register-host">

  <header class="marca">
    <div class="icon-wrap">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="15" stroke="currentColor" stroke-opacity="0.28" stroke-width="3.5"/>
          <circle cx="20" cy="20" r="15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="70 95" transform="rotate(-90 20 20)"/>
          <path d="M14.5 25.5c0-6.5 4.5-10.5 11-10.5 0 6.5-4.5 10.5-11 10.5z" fill="currentColor"/>
        </svg>
    </div>
    <span class="brand">Gelabem</span>
    <p class="subtitle">Crie sua conta e organize a cozinha em um minuto.</p>
  </header>

  <div class="card">

    <!-- Nome -->
    <div class="field">
      <label>Nome completo</label>
      <div class="input-wrap">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input type="text" placeholder="Seu nome" [(ngModel)]="nome" />
      </div>
    </div>

    <!-- E-mail -->
    <div class="field">
      <label>E-mail</label>
      <div class="input-wrap">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
        </span>
        <input type="email" placeholder="seu@email.com" [(ngModel)]="email" />
      </div>
    </div>

    <!-- Senha -->
    <div class="field">
      <label>Senha</label>
      <div class="input-wrap">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input [type]="mostrarSenha ? 'text' : 'password'" placeholder="Mínimo 8 caracteres" [(ngModel)]="senha"/>
        <span class="eye" (click)="toggleSenha()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
    </div>

    <!-- Confirmar senha -->
    <div class="field">
      <label>Confirmar senha</label>
      <div class="input-wrap">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </span>
        <input [type]="mostrarConfirmarSenha ? 'text' : 'password'" placeholder="Repita a senha" [(ngModel)]="repetirsenha"/>
        <span class="eye" (click)="toggleConfirmarSenha()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </span>
      </div>
    </div>

    @if (erro) {
      <p class="erro-form" role="alert">{{ erro }}</p>
    }

    <!-- Botão criar conta -->
    <button class="btn-primary" (click)="validarSenha()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      Criar conta grátis
    </button>

    <app-google-login (entrou)="aoEntrarComGoogle($event)" (erro)="erro = $event"></app-google-login>

    <p class="login-link">Já tem uma conta? <a routerLink="/login">Entrar</a></p>

  </div>
</div>
